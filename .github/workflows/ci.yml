name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build services
        run: docker compose build
      - name: Run smoke test
        run: |
          docker compose up -d
          for i in $(seq 1 12); do
            if curl --fail --silent http://localhost:8000/health; then
              break
            fi
            if [ "$i" -eq 12 ]; then
              docker compose logs
              docker compose down
              exit 1
            fi
            sleep 5
          done
          curl --fail http://localhost:8001/chat -H "Content-Type: application/json" -d '{"message":"test","connector":"google_search"}' || true
          docker compose down
